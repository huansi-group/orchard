server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: dataagent-backend
  datasource:
    url: jdbc:h2:mem:dataagent;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

app:
  jwt:
    # 开发环境默认密钥，生产环境请通过 JWT_SECRET 覆盖（至少 32 个字符）
    secret: ${JWT_SECRET:dataagent-demo-jwt-secret-key-change-me-in-production}
    issuer: dataagent
    expiration: ${JWT_EXPIRATION:24h}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

logging:
  level:
    org.springframework.security: INFO
